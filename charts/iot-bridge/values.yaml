image:
  repository: ghcr.io/muretimiriti/kora-iot-bridge
  tag: latest # overridden per environment -- environments/*/kustomization.yaml's valuesInline
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  port: 3000
  type: ClusterIP
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
