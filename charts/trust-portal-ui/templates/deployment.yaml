apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-portal-ui
  labels:
    app: trust-portal-ui
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: trust-portal-ui
  template:
    metadata:
      labels:
        app: trust-portal-ui
    spec:
      containers:
        - name: trust-portal-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
