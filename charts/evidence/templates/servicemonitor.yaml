# Phase 2 hardening (Kora ADR-066): lets the monitoring stack
# (infra/terraform/modules/monitoring in the app monorepo) scrape the /metrics endpoint added
# alongside the hash-chain verification job's ADR-054 counter
# (kora_evidence_chain_integrity_violations_total). The `release: kube-prometheus-stack` label
# is required -- that Helm release's own Prometheus CR only watches ServiceMonitors carrying it
# (confirmed via `kubectl get prometheus -o jsonpath='{.spec.serviceMonitorSelector}'` against
# the real cluster), not a guess.
#
# Disclosed gap: the currently-running evidence pod predates this /metrics route (no GHCR
# credential exists yet to push a new image -- same blocker as the Kyverno signature work), so
# this ServiceMonitor will scrape 404s until a real image ships. Real value once it does: no
# further infra change needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
