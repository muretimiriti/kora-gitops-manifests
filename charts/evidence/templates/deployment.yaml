apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence
  labels:
    app: evidence
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: evidence
  template:
    metadata:
      labels:
        app: evidence
    spec:
      containers:
        - name: evidence
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
