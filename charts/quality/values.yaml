image:
  repository: ghcr.io/muretimiriti/kora-quality
  tag: latest # overridden per environment -- environments/*/kustomization.yaml's valuesInline
  pullPolicy: Always # dev-latest is a floating tag; IfNotPresent silently served stale cached images (found: a rebuilt-and-repushed realtime-gateway image was ignored on restart)
replicaCount: 1

service:
  # Real listening port, taken from services/quality/.env.example's own PORT. The previous
  # charts all claimed 3000, which no service actually listens on.
  port: 3006
  type: ClusterIP

# Matches this service's actual health route.
healthPath: /health

serviceAccountName: quality-workload

# Non-secret config, rendered into a ConfigMap and loaded via envFrom. In-cluster DNS names
# come from the Terraform modules that provision each backing service.
env:
  PORT: "3006"
  NATS_URL: "nats://nats.kora-dev.svc.cluster.local:4222"
  VAULT_ADDR: "http://vault.kora-dev.svc.cluster.local:8200"
  # Phase 3, Stage B (ADR-069): matches this service's own Vault Kubernetes-auth role
  # (infra/scripts/vault-policies.sh in the app monorepo) -- quality-workload's ServiceAccount
  # above logs in as this role, scoped to only its own kora-signing paths.
  VAULT_K8S_ROLE: "quality-dev"

# Credentials live in a Secret created out of band (see infra/bootstrap in the app monorepo)
# so they are never committed to this repo. Empty means the service needs none.
secretName: kora-quality-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
