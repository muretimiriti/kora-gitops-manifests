# staging environment -- CICD_Deployment_Trust_Design.md Section 8.1a
# Tekton's open-promotion-pr Task (infra/tekton/tasks/tasks.yaml in the app monorepo) bumps
# each unit's `image.tag` value below via a scripted edit -- this is the "PR bumps image tag"
# step (Section 8.2), now a concrete, findable line per unit rather than a description.
#
# Phase 4: pruned from all 24 charts down to the same 9 real, buildable services dev's own
# kustomization.yaml lists -- this file previously listed all 24 (including 15 pure Phase-0
# scaffolds) with a "staging-latest" tag that has never been built, which would have produced
# 15 ImagePullBackOff Deployments and a permanently unhealthy ArgoCD Application the moment
# this was ever synced. Reuses the exact same real commit-SHA image tags currently live in
# dev -- same application code, no separate staging build needed for a first stand-up.
#
# Every real service below overrides NATS_URL (staging has its own NATS, not dev's) and, where
# it has a Vault dependency, VAULT_K8S_ROLE to its own "<service>-staging" role -- VAULT_ADDR
# is deliberately left at its chart default (dev's Vault) -- staging reuses dev's already-running
# Vault HA cluster rather than a second one (Phase 4's own explicit scope decision, see
# infra/terraform/environments/staging/main.tf's own comment in the app monorepo).
#
# Currently excluded (same 15 as dev, for the same reason): admin-console, agent-orchestrator,
# billing, core, esg, intelligence, iot-bridge, maintain, marketing-site, ops, ops-pwa,
# trust-portal, trust-portal-ui, vendor, web
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: ../../charts
helmCharts:
  - name: compliance
    releaseName: compliance
    namespace: kora-staging
    valuesInline:
      replicaCount: 1
      image:
        tag: 817492ebf770b925453471e04c636353e780fcf4
      env:
        NATS_URL: "nats://nats.kora-staging.svc.cluster.local:4222"
        VAULT_K8S_ROLE: "compliance-staging"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: compliance-forms
    releaseName: compliance-forms
